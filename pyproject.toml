[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gds-idea-gh-kit"
description = "CLI tool for auditing and enforcing GitHub repo standards for GDS IDEA teams"
readme = "README.md"
authors = [
    { name = "David Gillespie", email = "david.gillespie@digital.cabinet-office.gov.uk" },
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.27",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
]
dynamic = ["version"]

[project.scripts]
idea-gh = "gds_idea_gh_kit.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/gds_idea_gh_kit"]


[tool.hatch.build.hooks.vcs]
version-file = "src/gds_idea_gh_kit/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.gds-idea-app-kit]
framework = "python"
app_name = "gds-idea-gh-kit"
tool_version = "0.5.4"
python_version = "3.13"

[tool.gds-idea-app-kit.files]
LICENCE = "sha256:e6356e2315581a3c231279cbc7ca90111c55e9c10625b17a935359c800a3553a"
".github/CODEOWNERS" = "sha256:464aa53eb8be8c9b61185674b4dabec6cacbafa904aa48b46facdcd9a18e1fc5"
".github/workflows/ci.yml" = "sha256:baed13493483724c4f2cdec0df9d378dfc2f8df8a0f01bfb65a108c9d7af3d29"
".github/dependabot.yml" = "sha256:8472c537c3808394c9200ac7f67e61ce565981583c6f7f381339f1df255fb318"
".pre-commit-config.yaml" = "sha256:376617ea56a3e3b6691e423e33c1faeff299e95205c54208bbd3b3a5c619bd57"
".github/workflows/release.yml" = "sha256:d2c22e66042f7f7fca4dc1066ff3ffaa4303df9c8a57953684a0a927731b1fe6"
[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/gds_idea_gh_kit/_version.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["gds_idea_gh_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require GitHub API access (deselect with '-m \"not integration\"')",
]
