org: co-cddo
default_visibility: private

repo_prefixes:
  - gds-idea-

teams:
  cddo-idea-admins: admin
  cddo-idea-developers: write
  cddo-idea-readers: read

repo_settings:
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  has_issues: true
  has_wiki: false
  has_projects: false

required_files:
  - .gitignore
  - LICENSE
  - README.md
  - docs/README.md
  - .github/dependabot.yml

security:
  vulnerability_alerts: true
  automated_security_fixes: true

repo_types:
  cdk-app:
    naming_pattern: "gds-idea-app-{name}"
    detection_files: [cdk.json]
    default_branch: dev
    required_workflows: [lint.yml, test.yml, cdk-deploy-dev.yml, cdk-deploy-prod.yml]
    branch_protection:
      dev:
        require_pr: true
        required_approvals: 1
        dismiss_stale_reviews: true
        require_linear_history: true
        required_review_teams: [cddo-idea-developers]
        prevent_deletion: true
        prevent_force_push: true
        bypass_teams: [cddo-idea-superadmins]
        bypass_mode: pull_request
      prod:
        require_pr: true
        required_approvals: 1
        required_review_teams: [cddo-idea-admins]
        prevent_deletion: true
        prevent_force_push: true
        bypass_teams: []
        bypass_mode: pull_request

  python-package:
    naming_pattern: "gds-idea-{name}"
    detection_files: [pyproject.toml]
    default_branch: main
    required_workflows: [lint.yml, test.yml]
    branch_protection:
      main:
        require_pr: true
        required_approvals: 1
        dismiss_stale_reviews: true
        require_linear_history: true
        prevent_deletion: true
        prevent_force_push: true
