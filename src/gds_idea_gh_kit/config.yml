org: co-cddo
default_visibility: private

repo_prefixes:
  - gds-idea-

teams:
  gds-idea-all: read
  gds-idea-ds: maintain
  gds-idea-senior-ds: admin
  gds-idea-super-admin: admin

repo_settings:
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  has_issues: true
  has_wiki: false
  has_projects: false

required_files:
  - .gitignore
  - LICENSE
  - [README.md, docs/README.md]
  - .github/dependabot.yml

security:
  vulnerability_alerts: true
  automated_security_fixes: true

repo_types:
  cdk-app:
    naming_pattern: "gds-idea-app-{name}"
    detection_files: [cdk.json]
    default_branch: dev
    required_workflows:
      [ci_cd_cdk_app.yml, ci_pr_cdk_app.yml]
    branch_protection:
      dev:
        require_pr: true
        required_approvals: 1
        dismiss_stale_reviews: true
        require_linear_history: true
        required_review_teams: [gds-idea-ds]
        prevent_deletion: true
        prevent_force_push: true
        bypass_teams: [gds-idea-super-admin]
        bypass_mode: pull_request
      prod:
        require_pr: true
        required_approvals: 1
        required_review_teams: [gds-idea-senior-ds]
        prevent_deletion: true
        prevent_force_push: true
        bypass_teams: []
        bypass_mode: pull_request

  python-package:
    naming_pattern: "gds-idea-{name}"
    detection_files: [pyproject.toml]
    default_branch: main
    required_workflows: [lint.yml, test.yml]
    branch_protection:
      main:
        require_pr: true
        required_approvals: 1
        dismiss_stale_reviews: true
        require_linear_history: true
        required_review_teams: [gds-idea-ds]
        prevent_deletion: true
        prevent_force_push: true
        bypass_teams: [gds-idea-super-admin]
        bypass_mode: pull_request
